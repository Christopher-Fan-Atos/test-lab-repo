# Lints workflow YAML on every PR; intentionally has no AWS credentials
# or deploy steps, so it can never trigger a deployment.
name: PR Validation

on:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate workflow files
        uses: raven-actions/actionlint@v2
